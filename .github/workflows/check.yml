name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        node: [22, 24]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install the IMAP test server for the end-to-end test
        run: pipx install pymap==0.36.7
      - run: npm run verify
        env:
          WAYPOST_REQUIRE_E2E: '1'
      # Dependabot cannot rebuild the bundle. rebuild-runtime.yml does that after the merge.
      - name: Check committed runtime matches source
        if: github.actor != 'dependabot[bot]'
        run: git diff --exit-code -- runtime/waypost.mjs
      - run: npm pack --dry-run
