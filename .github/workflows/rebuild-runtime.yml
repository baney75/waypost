name: Rebuild runtime
# runtime/waypost.mjs is committed so a clone works with `node runtime/waypost.mjs mcp` and
# the plugin install needs no build step. Dependabot merges change dependencies but cannot
# rebuild the bundle, so this job rebuilds it on main and commits the result if it changed.
on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - src/**
      - tsconfig.json
permissions:
  contents: read
jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Commit the rebuilt bundle
        run: |
          if git diff --quiet -- runtime/waypost.mjs; then echo "Bundle is current."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/waypost.mjs
          git commit -m "Rebuild runtime bundle from merged sources"
          git push
