# Waypost self-hosting stack: remote MCP + agent calendar feed + Proton mirror sync, behind your own Cloudflare tunnel.
# waypost setup cloudflare makes the tunnel, writes secrets/tunnel_token and puts a free workers.dev front door on it.
# Mail is optional: add -f compose.mail.yaml to run Proton Mail Bridge beside Waypost. See docs/self-host.md.
name: waypost
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
services:
  waypost:
    <<: *hardening
    build: {context: .., dockerfile: deploy/Dockerfile}
    image: waypost:0.6.0
    user: "1000:1000"
    tmpfs: [/tmp:size=16m]
    volumes: [waypost-data:/data]
    # No published port: only cloudflared reaches Waypost, over the internal network.
    networks: [edge]
  cloudflared:
    <<: *hardening
    image: cloudflare/cloudflared:2026.9.1@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    user: "1000:1000"
    command: [tunnel, --no-autoupdate, run, --token-file, /run/secrets/tunnel_token]
    secrets: [tunnel_token]
    depends_on:
      waypost: {condition: service_healthy}
    networks: [edge]
networks:
  edge: {}
volumes:
  waypost-data: {}
secrets:
  tunnel_token: {file: ./secrets/tunnel_token}
