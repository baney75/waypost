<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc"><title id="title">Waypost documentation preview</title><desc id="desc">A documentation page with source setup and three service routes: Mail via Bridge IMAP, Drive via the official CLI, and Calendar via ICS files.</desc><rect width="1280" height="800" fill="#f3f0e7"/><g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#172331"><g color="#172331" transform="translate(95 38) scale(.42)"><path d="M48 82V48L20 20M48 48V14M48 48L76 20" fill="none" stroke="currentColor" stroke-width="9"/><path fill="currentColor" d="M12 12h17v9H21v8h-9zM39 6h18v9H39zM67 12h17v17h-9v-8h-8z"/></g><text x="147" y="70" font-size="26" font-weight="700" letter-spacing="-.7">Waypost</text><text x="943" y="65" font-size="14">Setup</text><text x="1017" y="65" font-size="14">Boundaries</text><text x="1136" y="65" font-size="14">GitHub</text><path d="M96 103H1184" stroke="#d5d7cf"/><g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="1.4" fill="#59616a"><text x="97" y="164">INDEPENDENT PROJECT / LOCAL MCP</text></g><rect x="400" y="149" width="45" height="21" fill="none" stroke="#c9a292"/><text x="409" y="164" font-size="11" fill="#a3482e">BETA</text><text x="95" y="246" font-size="62" font-weight="600" letter-spacing="-2.6">Mail and files.</text><text x="95" y="314" font-size="62" font-weight="600" letter-spacing="-2.6">Calendar handoffs.</text><text x="97" y="370" font-size="21" fill="#59616a">A local CLI and MCP for your Proton account.</text><rect x="97" y="401" width="176" height="46" fill="#172331"/><text x="117" y="430" font-size="14" fill="#f3f0e7" font-weight="600">Set up from source</text><text x="300" y="430" font-size="14">Setup guide</text><path d="M300 436H391" stroke="#172331"/><rect x="745" y="148" width="439" height="308" fill="#fffdf8" stroke="#d5d7cf"/><text x="773" y="184" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" letter-spacing="1.3" fill="#59616a">SUPPORTED ROUTES</text><path d="M773 221H884M909 221H1020M1045 221H1156" stroke="#172331" stroke-width="3"/><text x="773" y="248" font-size="16" font-weight="600">Mail</text><text x="909" y="248" font-size="16" font-weight="600">Drive</text><text x="1045" y="248" font-size="16" font-weight="600">Calendar</text><g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#59616a"><text x="773" y="269">Bridge / IMAP</text><text x="909" y="269">Official CLI</text><text x="1045" y="269">ICS files</text></g><g fill="none" stroke="#cc6949" stroke-width="2"><path d="M828 284V311L965 357V376M965 284V376M1102 284V311L965 357"/></g><g fill="#cc6949"><rect x="824" y="280" width="8" height="8"/><rect x="961" y="280" width="8" height="8"/><rect x="1098" y="280" width="8" height="8"/><rect x="961" y="372" width="8" height="8"/></g><path d="M773 392H1156" stroke="#d5d7cf"/><text x="773" y="418" font-size="14" font-weight="600">Waypost</text><text x="960" y="418" font-size="11" fill="#59616a">Local process · MCP / CLI</text><text x="773" y="440" font-size="11" fill="#59616a">Each service keeps its own setup and limits.</text><path d="M96 503H1184" stroke="#d5d7cf"/><text x="97" y="550" font-size="26" font-weight="600" letter-spacing="-.6">Three services. Three routes.</text><text x="932" y="548" font-size="13" fill="#59616a">Routes documented by Proton.</text><g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" letter-spacing="1" fill="#59616a"><text x="97" y="590">SERVICE</text><text x="270" y="590">ROUTE</text><text x="630" y="590">WHAT TO EXPECT</text></g><path d="M96 605H1184M96 659H1184M96 713H1184" stroke="#d5d7cf"/><g font-size="14"><text x="97" y="639" font-weight="600">Mail</text><text x="270" y="639">Local Proton Mail Bridge</text><text x="630" y="639" fill="#59616a">Read mail over IMAP. Bridge requires a paid Mail plan.</text><text x="97" y="693" font-weight="600">Drive</text><text x="270" y="693">Official Proton Drive CLI</text><text x="630" y="693" fill="#59616a">List, inspect, download, and optionally upload.</text><text x="97" y="747" font-weight="600">Calendar</text><text x="270" y="747">ICS snapshots + prepared imports</text><text x="630" y="747" fill="#59616a">Read snapshots. Prepare files for manual import.</text></g></g></svg>
